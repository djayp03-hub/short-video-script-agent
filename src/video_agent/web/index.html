<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>短视频脚本 · 对话工作台</title>
<style>
:root{--ink:#182447;--muted:#65718a;--blue:#2944ae;--line:#e2e6ef;--paper:#f5f6fa;--orange:#925414;--green:#206746}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Microsoft YaHei",system-ui,sans-serif}button,select,textarea,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button,select{border:1px solid var(--line);border-radius:9px;padding:8px 14px;background:white;color:var(--ink)}button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}header{background:white;border-bottom:1px solid var(--line);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:22px;letter-spacing:.5px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-controls{display:flex;align-items:center;gap:10px}label{font-size:13px;color:var(--muted)}.mode-note{padding:9px 32px;color:var(--orange);background:#fffaee;border-bottom:1px solid #f0e6cc;font-size:13px}.layout{max-width:1550px;margin:0 auto;display:grid;grid-template-columns:minmax(400px,1.05fr) minmax(400px,1fr);height:calc(100dvh - 132px);min-height:650px}.chat{background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.messages{padding:28px 30px;overflow:auto;flex:1;scroll-behavior:smooth}.welcome{max-width:530px;margin:30px auto 22px}.welcome .eyebrow{color:var(--blue);font-size:12px;font-weight:bold;letter-spacing:2px}.welcome h2{font-size:27px;line-height:1.5;margin:10px 0}.welcome p{color:var(--muted);margin:10px 0 23px}.suggestions{display:grid;gap:9px}.suggestions button{text-align:left;padding:12px 15px;background:#f8f9fd}.suggestions span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.message{margin-bottom:23px}.message .role{font-size:12px;color:var(--muted);margin-bottom:7px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.message.user .bubble{background:#edf0fb;padding:13px 17px;border-radius:12px}.message.user{margin-left:40px}.message.assistant{margin-right:15px}.waiting{font-size:13px;color:var(--blue);padding:10px 0}.waiting::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.25}}.composer{padding:15px 24px 20px;border-top:1px solid var(--line);background:white}.composer textarea{resize:vertical;min-height:85px;max-height:200px;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);outline:none}.composer textarea:focus,input:focus{border-color:var(--blue)}.composer-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:9px}.hint{font-size:12px;color:var(--muted)}.primary{background:var(--blue);border-color:var(--blue);color:white;min-width:92px}.primary:hover:not(:disabled){color:white;background:#20388d}.attach{margin-bottom:10px}.attach summary{font-size:13px;color:var(--blue);cursor:pointer}.attach-fields{padding-top:9px;display:grid;gap:7px}.attach-fields input{padding:8px 11px;border:1px solid var(--line);border-radius:8px;width:100%}.attach-fields textarea{min-height:70px}.workspace{padding:23px 27px;overflow:auto;min-width:0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}.section-title h2{font-size:17px;margin:0}.status{font-size:12px;font-weight:bold;color:var(--muted);background:#e9edf4;border-radius:5px;padding:4px 9px}.status.good{background:#e4f2e9;color:var(--green)}.status.warn{background:#fff0da;color:var(--orange)}.requirements{margin-bottom:24px}.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 17px}.req-item{font-size:13px;overflow-wrap:anywhere}.req-item span{color:var(--muted);margin-right:7px}.req-item.wide{grid-column:1/-1}.panel{padding-top:21px;border-top:1px solid var(--line)}.empty{padding:45px 20px;text-align:center;color:var(--muted);border:1px dashed #ccd3e4;border-radius:12px;background:#fafbff}.empty h3{font-size:17px;color:var(--ink);font-weight:500}.empty p{font-size:13px}.script-title{font-size:21px;line-height:1.6;margin:0 0 10px}.metrics{font-size:13px;color:var(--muted);margin-bottom:17px}.checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.check{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:5px}.check.pass{color:var(--green);border-color:#b9d9c9;background:#f2faf5}.check.fail{color:#a13d30;border-color:#edc6bf;background:#fff6f3}.scene{background:white;border:1px solid var(--line);border-radius:10px;padding:17px 18px;margin:12px 0}.scene h4{margin:0 0 12px;font-size:15px}.scene-line{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:9px 0}.scene-line strong{display:inline-block;color:var(--muted);font-weight:400;margin-right:9px}.scene-sources{font-size:12px;color:var(--blue);margin-top:10px}.risk{font-size:13px;color:var(--orange);white-space:pre-wrap}.downloads{display:flex;gap:8px;margin:17px 0}.downloads button{font-size:12px}.evidence{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.evidence summary{font-size:14px;cursor:pointer;font-weight:bold}.source{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.source strong{display:block;color:var(--blue);margin-bottom:5px}.trace-row{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.trace-row strong{color:var(--blue)}.path{font-size:11px;color:var(--muted);word-break:break-all;margin-top:14px}.error{color:#a13d30;font-size:13px;white-space:pre-wrap}.banner{font-size:12px;color:var(--muted);margin-top:15px}.hidden{display:none!important}@media(max-width:950px){header{padding:16px 20px;flex-wrap:wrap}.mode-note{padding:9px 20px}.layout{grid-template-columns:1fr;height:auto;min-height:0}.chat{height:80dvh;min-height:600px;border-right:0}.workspace{border-top:1px solid var(--line);min-height:500px}h1{font-size:20px}.messages{padding:20px}.top-controls{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<header><div><h1>短视频脚本 · 对话工作台</h1><p>先说想法，再一起把脚本改到可用</p></div><div class="top-controls"><label for="mode">运行模式</label><select id="mode"><option value="mock">离线演示</option><option value="real">真实模型 · 百炼</option></select><button id="new-chat">新建对话</button></div></header>
<div class="mode-note" id="mode-note">正在连接本地服务…</div>
<main class="layout">
 <section class="chat" aria-label="与脚本 Agent 对话">
  <div class="messages" id="messages" aria-live="polite"></div>
  <form class="composer" id="chat-form">
   <details class="attach" id="attach"><summary>补充产品素材</summary><div class="attach-fields"><label for="material-product">素材所属产品</label><input id="material-product" maxlength="500" placeholder="例如：剪映盒演示版"><label for="material-text">资料正文</label><textarea id="material-text" maxlength="8000" placeholder="粘贴可以引用的产品事实。发送本条消息时一并添加。"></textarea><span class="hint">资料只加入当前会话。用户提供的资料不代表独立核实。</span></div></details>
   <label for="message" class="hidden">对话消息</label><textarea id="message" maxlength="4000" placeholder="说说主题、产品、受众、平台、时长与风格，也可以继续修改上一版…" required></textarea>
   <div class="composer-footer"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="primary" id="send" type="submit">发送</button></div><div id="error" class="error" role="alert"></div>
  </form>
 </section>
 <aside class="workspace" aria-label="脚本与检查结果">
  <section class="requirements"><div class="section-title"><h2>本次需求</h2><span class="status" id="task-status">待开始</span></div><div class="req-grid" id="requirements"></div></section>
  <section class="panel"><div class="section-title"><h2>脚本与检查</h2><span class="hint" id="turn-count"></span></div><div id="result"></div></section>
 </aside>
</main>
<script>
'use strict';
const TOKEN='__API_TOKEN__';
const $=id=>document.getElementById(id);
let session=null, config=null, busy=false, pollTimer=null;
const statusNames={completed:'自动检查通过',needs_input:'需要补充',incomplete:'未完成',failed:'失败'};
function el(tag, text, className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Agent-Token':TOKEN},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await response.json();if(!response.ok){const error=new Error(data.message||'请求失败');error.code=data.error;throw error;}return data;}
function setBusy(value){busy=value;['send','mode','new-chat'].forEach(id=>$(id).disabled=value);$('message').disabled=value;$('material-product').disabled=value;$('material-text').disabled=value;$('send').textContent=value?'处理中…':'发送';}
function modeNote(){if(!config)return;if($('mode').value==='mock')$('mode-note').textContent='离线演示：固定规则模拟，支持补充需求和时长修正，不证明真实模型的聊天或创作效果。';else $('mode-note').textContent=config.has_api_key?`真实模型：${config.model}。发送后会调用百炼并产生费用，每轮含需求整理与脚本检查。`:'真实模式尚未配置密钥：请在项目 .env 中填写 VIDEO_API_KEY 或 DASHSCOPE_API_KEY，并重启 run_chat.py。';}
function welcome(){const wrap=el('div',undefined,'welcome');wrap.append(el('div','脚本协作','eyebrow'),el('h2','从一个想法开始，\n把需求和事实说清楚'),el('p','告诉我你想介绍什么、给谁看、发在哪、做多长。信息不足时，我会继续追问。'));const list=el('div',undefined,'suggestions');const examples=[['生成一份完整脚本','介绍剪映盒演示版的字幕功能，给学生看，发抖音，30秒，清晰自然。'],['先说想法，再补充信息','我想介绍剪映盒演示版的字幕功能，30秒。']];for(const [label,value] of examples){const button=el('button',label);button.type='button';button.append(el('span',value));button.onclick=()=>{$('message').value=value;$('message').focus();};list.append(button);}wrap.append(list);return wrap;}
function renderMessages(){const box=$('messages');box.replaceChildren();if(!session?.messages.length)box.append(welcome());else for(const m of session.messages){const row=el('div',undefined,'message '+m.role);row.append(el('div',m.role==='user'?'你':(session.mode==='mock'?'Agent · 离线演示':'Agent · 真实模型'),'role'),el('div',m.content,'bubble'));box.append(row);}if(busy){box.append(el('div','正在整理需求或运行检查，请等待本轮结果…','waiting'));}box.scrollTop=box.scrollHeight;}
function renderRequirements(){const req=session?.request||{};const grid=$('requirements');grid.replaceChildren();const labels={product:'产品',theme:'主题',audience:'受众',platform:'平台',target_seconds:'时长上限',style:'风格',instructions:'额外要求'};for(const [key,name] of Object.entries(labels)){const row=el('div',undefined,'req-item'+(['theme','instructions'].includes(key)?' wide':''));row.append(el('span',name),document.createTextNode(req[key]===undefined?'未填写':String(req[key])+(key==='target_seconds'?' 秒':'')));grid.append(row);}const status=session?.result?.status;$('task-status').textContent=busy?'处理中':statusNames[status]||(session?.messages.length?'等待补充 / 交流中':'待开始');$('task-status').className='status '+(status==='completed'?'good':status?'warn':'');$('turn-count').textContent=session?`第 ${session.turns} 轮` : '';}
function markdown(result){const d=result.draft;const timings=result.checks?.estimate_duration?.scenes||[];const lines=['# '+d.title,'',`状态：${result.status}；预计总时长：${result.estimated_total_seconds??'未检查'} 秒`,''];d.scenes.forEach((s,i)=>lines.push(`## 镜头 ${i+1}（${timings[i]?.seconds??'未检查'} 秒）`,'','画面：'+s.visual,'','旁白：'+s.narration,'','字幕：'+s.subtitle,'','来源：'+s.source_ids.join(', '),''));lines.push('时长为估算，自动审核仍需人工复核。');return lines.join('\n');}
function download(value,type,name){const link=el('a');link.href=URL.createObjectURL(new Blob([value],{type}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
function renderResult(){const box=$('result');box.replaceChildren();const r=session?.result||session?.reference_result;const reference=!session?.result&&Boolean(session?.reference_result);if(reference)box.append(el('p','上次生成的脚本。本轮仅交流，没有重新生成或检查。','risk'));if(!r?.draft){const empty=el('div',undefined,'empty');empty.append(el('h3',r?'本轮尚未生成合格脚本':'脚本会显示在这里'),el('p',r?('状态：'+statusNames[r.status]+'；原因：'+r.reason):'补齐需求后，可查看分镜、预计时长、素材来源和检查结果。'));box.append(empty);return;}box.append(el('h3',r.draft.title,'script-title'),el('div',`预计总时长 ${r.estimated_total_seconds??'未检查'} 秒 · 修订 ${r.revision} · ${r.steps} 次 Agent 决策`,'metrics'));const checks=el('div',undefined,'checks');for(const [key,name] of [['estimate_duration','时长'],['check_rules','规则']]){const check=r.checks?.[key];checks.append(el('span',name+'：'+(check?(check.passed?'通过':'未通过'):'未检查'),'check '+(check?(check.passed?'pass':'fail'):'')));}checks.append(el('span','人工复核：待完成','check'));box.append(checks);if(r.status!=='completed')box.append(el('p','当前草稿尚未完成验收，不能作为已合格脚本使用。','risk'));for(const issue of r.risks||[])box.append(el('p',issue,'risk'));const timings=r.checks?.estimate_duration?.scenes||[];r.draft.scenes.forEach((scene,i)=>{const node=el('article',undefined,'scene');node.append(el('h4',`镜头 ${i+1} · ${timings[i]?.seconds??'未检查'} 秒`));for(const [key,name] of [['visual','画面'],['narration','旁白'],['subtitle','字幕']]){const line=el('div',undefined,'scene-line');line.append(el('strong',name),document.createTextNode(scene[key]||'（无）'));node.append(line);}node.append(el('div','来源：'+scene.source_ids.join('、'),'scene-sources'));box.append(node);});const buttons=el('div',undefined,'downloads');for(const [label,action] of [['下载脚本 Markdown',()=>download(markdown(r),'text/markdown;charset=utf-8','script.md')],['下载结果 JSON',()=>download(JSON.stringify(r,null,2),'application/json','output.json')]]){const button=el('button',label);button.onclick=action;buttons.append(button);}box.append(buttons,el('p','时长为公式估算。自动语义审核可能漏判，请逐条复核事实和创作质量。','banner'));const sources=el('details',undefined,'evidence');sources.append(el('summary',`素材来源（${r.sources?.length||0}）`));for(const source of r.sources||[]){const entry=el('div',undefined,'source');entry.append(el('strong',`${source.id} · ${source.product} · ${source.version}${source.user_provided?' · 用户提供':''}`),document.createTextNode(source.text));sources.append(entry);}box.append(sources);}
function renderEvidence(){const box=$('result');if(session?.trace.length){const details=el('details',undefined,'evidence');details.append(el('summary',`本轮 Agent 执行记录（${session.trace.length} 步）`));for(const t of session.trace){const obs=t.observation;let summary='';if(obs?.error)summary=obs.error.code+': '+obs.error.message;else if(obs?.data?.materials)summary='检索到：'+(obs.data.materials.map(m=>m.id).join('、')||'无素材');else if(obs?.data?.total_seconds!==undefined)summary=`预计 ${obs.data.total_seconds} 秒；${obs.data.passed?'通过':'超限'}`;else if(obs?.data?.passed!==undefined)summary=obs.data.passed?'检查通过':(obs.data.issues||[]).join('；');else if(obs?.data?.revision)summary='提交修订 '+obs.data.revision;else summary=JSON.stringify(obs?.data||{});const row=el('div',undefined,'trace-row');row.append(el('strong',`${t.step}. ${t.decision?.action||'模型调用失败'}`),el('div',summary));if(t.decision?.reason)row.append(el('div','依据：'+t.decision.reason));details.append(row);}box.append(details);}if(session?.artifact_dir)box.append(el('div','本轮记录：'+session.artifact_dir,'path'));}
function render(){renderMessages();renderRequirements();renderResult();renderEvidence();}
async function newChat(mode=$('mode').value){
 clearTimeout(pollTimer);
 setBusy(true);
 try {
  const next=await api('/api/sessions',{mode});
  session=next;
  localStorage.setItem('video-agent-session',session.id);
  ['message','material-product','material-text'].forEach(id=>$(id).value='');
  $('attach').open=false;
  $('mode').value=session.mode;
  modeNote();
  $('error').textContent='';
 } finally {
  setBusy(false);
  render();
 }
}
async function recoverBusy(){try{session=await api('/api/sessions/'+session.id);setBusy(session.busy);render();if(session.busy)pollTimer=setTimeout(recoverBusy,2000);}catch(error){setBusy(false);$('error').textContent=error.message;}}
$('chat-form').onsubmit=async event=>{event.preventDefault();if(busy||!session)return;let message=$('message').value.trim();const product=$('material-product').value.trim(),facts=$('material-text').value.trim();const attachments=[];if(product||facts){if(!product||!facts){$('error').textContent='请同时填写素材产品和正文。';return;}attachments.push({product,text:facts});}if(!message)return;$('error').textContent='';const previous=structuredClone(session);session.messages.push({role:'user',content:message});setBusy(true);renderMessages();renderRequirements();try{session=await api('/api/sessions/'+session.id+'/messages',{message,attachments});$('message').value='';$('material-product').value='';$('material-text').value='';$('attach').open=false;}catch(error){session=previous;$('error').textContent=error.message;try{session=await api('/api/sessions/'+session.id);}catch(_){} }finally{setBusy(session?.busy||false);render();if(session?.busy)pollTimer=setTimeout(recoverBusy,2000);else $('message').focus();}};
$('message').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('chat-form').requestSubmit();}};
$('new-chat').onclick=()=>newChat().catch(error=>$('error').textContent=error.message);
$('mode').onchange=()=>newChat().catch(error=>{$('mode').value=session?.mode||config.default_mode;modeNote();$('error').textContent='切换模式失败，仍保留原会话。'+error.message;});
(async()=>{try{config=await api('/api/config');$('mode').value=config.default_mode;const saved=localStorage.getItem('video-agent-session');if(saved){try{session=await api('/api/sessions/'+saved);}catch(_){}}if(!session)await newChat();else{$('mode').value=session.mode;modeNote();setBusy(session.busy);render();if(session.busy)pollTimer=setTimeout(recoverBusy,2000);}}catch(error){$('mode-note').textContent='未能连接本地服务。';$('error').textContent=error.message;}})();
</script>
</body></html>
