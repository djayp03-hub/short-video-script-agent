[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-video-agent"
version = "0.1.0"
description = "Evidence-grounded short video script agent with replayable evaluations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_agent = ["web/*.html"]
